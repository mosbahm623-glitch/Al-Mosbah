name: Daily backup

# نسخة احتياطية من قاعدة البيانات (من غير تشفير)، بتتعمل مرتين في اليوم، وبتترفع على Google Drive بتاع صاحب التطبيق:
#   - mosbah_<تاريخ>.dump  للاسترجاع
#   - mosbah_<تاريخ>.xlsx  نفس إكسيل صفحة النسخ الاحتياطي في التطبيق (عربي، بأسماء المشاريع والحالات)
# المستودع عام: النسخة ما بتتحفظش هنا ولا في Artifacts، بتروح على Drive بس.
# أسرار مطلوبة (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL   رابط الاتصال بقاعدة البيانات (Session pooler)
#   RCLONE_CONF       محتوى ملف إعداد rclone لـ Google Drive (remote اسمه gdrive)
#   GMAIL_USER / GMAIL_APP_PASSWORD  (اختياري) إيميل Gmail وApp Password، عشان الإكسيل يتبعت على نفس الإيميل بعد كل نسخة

on:
  schedule:
    - cron: '23 1,13 * * *' # 01:23 و13:23 UTC (مرتين في اليوم)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      DRIVE_DIR: gdrive:mosbah-backups
      KEEP_DAYS: '30'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check secrets
        run: |
          for v in SUPABASE_DB_URL RCLONE_CONF; do
            if [ -z "${!v}" ]; then echo "::error::السر $v مش متضاف"; exit 1; fi
          done

      - name: Install tools (postgresql-client 17, rclone)
        run: |
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 rclone

      - name: Dump database
        run: |
          set -euo pipefail
          umask 077
          stamp=$(date -u +%Y-%m-%d_%H%M)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=private --schema=auth --schema=storage --schema=supabase_migrations \
            --file="mosbah_$stamp.dump"
          # فحص إن الملف سليم وفيه جداول
          tables=$(/usr/lib/postgresql/17/bin/pg_restore --list "mosbah_$stamp.dump" | grep -c "TABLE DATA" || true)
          echo "جداول فيها بيانات: $tables"
          if [ "$tables" -lt 10 ]; then echo "::error::النسخة شكلها ناقصة"; exit 1; fi
          ls -l mosbah_*.dump

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Export the Excel backup (same layout as the app's Backup page)
        id: excel
        continue-on-error: true
        env:
          TZ: Africa/Cairo
        run: |
          set -euo pipefail
          umask 077
          npm ci --ignore-scripts
          npm i --no-save --ignore-scripts pg tsx
          npx tsx scripts/backup-excel.ts "mosbah_${STAMP}.xlsx"
          ls -l "mosbah_${STAMP}.xlsx"

      - name: Upload to Google Drive and prune old copies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone copy "mosbah_${STAMP}.dump" "$DRIVE_DIR"
          rclone lsl "$DRIVE_DIR" | grep "mosbah_${STAMP}.dump"
          if [ -f "mosbah_${STAMP}.xlsx" ]; then
            rclone copy "mosbah_${STAMP}.xlsx" "$DRIVE_DIR"
            rclone lsl "$DRIVE_DIR" | grep "mosbah_${STAMP}.xlsx"
          fi
          rclone delete "$DRIVE_DIR" --min-age "${KEEP_DAYS}d"
          rm -f ~/.config/rclone/rclone.conf

      - name: Email the Excel backup
        # بيتخطى لو أسرار الإيميل مش متضافة، والنسخة نفسها مش بتتأثر
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GMAIL_USER:-}" ] || [ -z "${GMAIL_APP_PASSWORD:-}" ]; then
            echo "::notice::أسرار الإيميل مش متضافة، تخطّيت إرسال الإيميل"; exit 0
          fi
          [ -f "mosbah_${STAMP}.xlsx" ] || { echo "::notice::مفيش ملف إكسيل أبعته"; exit 0; }
          python3 - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          stamp = os.environ["STAMP"]
          me = os.environ["GMAIL_USER"]
          m = EmailMessage()
          m["From"] = me
          m["To"] = me
          m["Subject"] = f"نسخة احتياطية المصباح {stamp}"
          m.set_content("النسخة الاحتياطية الأخيرة مرفقة (إكسيل). نسخة الاسترجاع الكاملة (.dump) على Google Drive.")
          with open(f"mosbah_{stamp}.xlsx", "rb") as f:
              m.add_attachment(f.read(), maintype="application",
                               subtype="vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                               filename=f"mosbah_{stamp}.xlsx")
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=ssl.create_default_context()) as s:
              s.login(me, os.environ["GMAIL_APP_PASSWORD"])
              s.send_message(m)
          print("email sent")
          PY

      - name: Fail if the Excel export failed (the .dump is already safe on Drive)
        if: steps.excel.outcome == 'failure'
        run: |
          echo "::error::تصدير Excel فشل، لكن نسخة .dump اترفعت على Drive"
          exit 1
