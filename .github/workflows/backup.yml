name: Daily backup

# نسخة احتياطية من قاعدة البيانات (من غير تشفير)، بتتعمل مرتين في اليوم، وبتترفع على Google Drive بتاع صاحب التطبيق:
#   - legacy_backup_<تاريخ>.dump  للاسترجاع
#   - legacy_backup_<تاريخ>.xlsx  نفس إكسيل صفحة النسخ الاحتياطي في التطبيق (عربي، بأسماء المشاريع والحالات)
#   - فولدر mosbah-invoices        صور وملفات الفواتير نفسها (الـ dump فيه أسماءها بس). بيتنسخ الجديد بس،
#                                  ومفيش حاجة بتتمسح منه: ملف اتمسح من التطبيق بيفضل على Drive.
# المستودع عام: النسخة ما بتتحفظش هنا ولا في Artifacts، بتروح على Drive بس.
# أسرار مطلوبة (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL   رابط الاتصال بقاعدة البيانات (Session pooler)
#   RCLONE_CONF       محتوى ملف إعداد rclone لـ Google Drive (remote اسمه gdrive)
#   SUPABASE_S3_ACCESS_KEY_ID / SUPABASE_S3_SECRET_ACCESS_KEY  مفتاح S3 من Storage في Supabase (لنسخ الفواتير)
#   GMAIL_USER / GMAIL_APP_PASSWORD  (اختياري) إيميل Gmail وApp Password، عشان الإكسيل يتبعت على نفس الإيميل بعد كل نسخة

on:
  schedule:
    # بيحاول كل ساعة، لأن GitHub بيأخر أو بيتخطى المواعيد التلقائية. لو فيه نسخة أحدث من 11 ساعة على Drive بيقف فورًا، يعني النتيجة نسختين في اليوم تقريبًا حتى لو ميعاد فاته.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # قاعدة بيانات مؤقتة بنجرّب عليها استرجاع النسخة (بتتمسح مع التشغيل)
      restore-test:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      DRIVE_DIR: gdrive:mosbah-backups
      # فولدر لوحده برة DRIVE_DIR، عشان مسح النسخ الأقدم من KEEP_DAYS ما يلمسش الفواتير
      INVOICES_DIR: gdrive:mosbah-invoices
      KEEP_DAYS: '30'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check secrets
        run: |
          for v in SUPABASE_DB_URL RCLONE_CONF; do
            if [ -z "${!v}" ]; then echo "::error::السر $v مش متضاف"; exit 1; fi
          done

      - name: Skip if a backup newer than 11 hours already exists on Drive
        id: guard
        if: github.event_name == 'schedule'
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          recent=$(rclone lsf "$DRIVE_DIR" --files-only --include 'legacy_backup_*.dump' --max-age 11h || true)
          rm -f ~/.config/rclone/rclone.conf
          if [ -n "$recent" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "فيه نسخة حديثة على Drive، مفيش داعي لنسخة جديدة: $recent"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "مفيش نسخة أحدث من 11 ساعة، هنعمل نسخة جديدة"
          fi

      - name: Install tools (postgresql-client 17, rclone)
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 rclone

      - name: Dump database (and fingerprint every table at the same instant)
        if: steps.guard.outputs.skip != 'true'
        env:
          PGBIN: /usr/lib/postgresql/17/bin
        run: |
          set -euo pipefail
          umask 077
          stamp=$(TZ=Africa/Cairo date +%Y-%m-%d_%H-%M)  # التاريخ والساعة بتوقيت مصر
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          # جلسة مفتوحة بتثبّت صورة واحدة للداتا: الـ dump والبصمات بيتاخدوا منها بالظبط
          coproc SRC { "$PGBIN/psql" "$SUPABASE_DB_URL" -qAt -v ON_ERROR_STOP=1; }
          q() { printf '%s\n' "$1" >&"${SRC[1]}"; }
          rd() { IFS= read -r REPLY <&"${SRC[0]}"; }
          q "begin isolation level repeatable read read only;"
          q "set timezone = 'UTC';"
          q "set extra_float_digits = 3;"
          q "select pg_export_snapshot();"; rd; snap="$REPLY"
          echo "snapshot: $snap"
          "$PGBIN/pg_dump" "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges --snapshot="$snap" \
            --schema=public --schema=private --schema=auth --schema=storage --schema=supabase_migrations \
            --file="legacy_backup_$stamp.dump"
          q "select string_agg(quote_ident(schemaname)||'.'||quote_ident(tablename), ' ' order by 1) from pg_tables where schemaname in ('public','private','auth','storage');"; rd
          : > src_fingerprints.txt
          for t in $REPLY; do
            q "select md5(coalesce(string_agg(r::text, E'\n' order by r::text collate \"C\"), '')) || ' ' || count(*) from $t r;"; rd
            echo "$t $REPLY" >> src_fingerprints.txt
          done
          q "rollback;"; q '\q'
          wait "$SRC_PID" || true
          echo "بصمات اتاخدت لـ $(wc -l < src_fingerprints.txt) جدول"
          # فحص إن الملف سليم وفيه جداول
          tables=$("$PGBIN/pg_restore" --list "legacy_backup_$stamp.dump" | grep -c "TABLE DATA" || true)
          echo "جداول فيها بيانات: $tables"
          if [ "$tables" -lt 10 ]; then echo "::error::النسخة شكلها ناقصة"; exit 1; fi
          ls -l legacy_backup_*.dump

      - name: Test restore into a temporary database and compare every value
        if: steps.guard.outputs.skip != 'true'
        id: restore
        continue-on-error: true
        env:
          PGBIN: /usr/lib/postgresql/17/bin
          TESTDB: postgresql://postgres:restore-test-only@localhost:5432/postgres
        run: |
          set -uo pipefail
          f="legacy_backup_${STAMP}.dump"
          for r in anon authenticated service_role authenticator supabase_admin supabase_auth_admin supabase_storage_admin dashboard_user; do
            "$PGBIN/psql" "$TESTDB" -qAt -c "create role $r nologin" 2>/dev/null || true
          done
          "$PGBIN/pg_restore" --no-owner --no-privileges --dbname="$TESTDB" "$f" 2> restore_errors.txt || true
          echo "أخطاء الاسترجاع (غالبًا إضافات خاصة بـ Supabase): $(grep -c 'error:' restore_errors.txt || true)"
          grep 'error:' restore_errors.txt | sed 's/^pg_restore: //' | sort | uniq -c | sort -rn | head -8 || true
          bad=0; total=0
          "$PGBIN/psql" "$TESTDB" -qAt -c "set timezone='UTC'" >/dev/null 2>&1 || true
          while read -r t src_md5 src_n; do
            total=$((total+1))
            out=$("$PGBIN/psql" "$TESTDB" -qAt -c "set timezone='UTC'; set extra_float_digits=3; select md5(coalesce(string_agg(r::text, E'\n' order by r::text collate \"C\"), '')) || ' ' || count(*) from $t r" 2>/dev/null | tail -1 || true)
            got_md5=${out%% *}; got_n=${out##* }
            if [ -z "$out" ]; then
              echo "::warning::الجدول $t مش موجود بعد الاسترجاع"; bad=$((bad+1))
            elif [ "$got_md5" != "$src_md5" ]; then
              echo "::warning::القيم مختلفة في $t: الأصل=$src_n صف والاسترجاع=$got_n صف"; bad=$((bad+1))
            fi
          done < src_fingerprints.txt
          echo "جداول اتقارنت بالقيم: $total، فيها اختلاف: $bad"
          if [ "$total" -lt 10 ] || [ "$bad" -gt 0 ]; then
            echo "::error::اختبار الاسترجاع فشل"; exit 1
          fi
          echo "اختبار الاسترجاع نجح: كل الجداول رجعت بنفس القيم بالظبط"

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Export the Excel backup (same layout as the app's Backup page)
        if: steps.guard.outputs.skip != 'true'
        id: excel
        continue-on-error: true
        env:
          TZ: Africa/Cairo
        run: |
          set -euo pipefail
          umask 077
          npm ci --ignore-scripts
          npx tsx scripts/backup-excel.ts "legacy_backup_${STAMP}.xlsx"
          ls -l "legacy_backup_${STAMP}.xlsx"

      - name: Upload to Google Drive and prune old copies
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone copy "legacy_backup_${STAMP}.dump" "$DRIVE_DIR"
          rclone lsl "$DRIVE_DIR" | grep "legacy_backup_${STAMP}.dump"
          if [ -f "legacy_backup_${STAMP}.xlsx" ]; then
            rclone copy "legacy_backup_${STAMP}.xlsx" "$DRIVE_DIR"
            rclone lsl "$DRIVE_DIR" | grep "legacy_backup_${STAMP}.xlsx"
          fi
          rclone delete "$DRIVE_DIR" --min-age "${KEEP_DAYS}d"
          rm -f ~/.config/rclone/rclone.conf

      - name: Copy new invoice files to Google Drive
        if: steps.guard.outputs.skip != 'true'
        id: invoices
        continue-on-error: true
        env:
          RCLONE_CONFIG_SUPA_TYPE: s3
          RCLONE_CONFIG_SUPA_PROVIDER: Other
          RCLONE_CONFIG_SUPA_ENDPOINT: https://kytaxbhajnmdstyiorus.supabase.co/storage/v1/s3
          RCLONE_CONFIG_SUPA_REGION: eu-west-1
          RCLONE_CONFIG_SUPA_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SUPA_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_SUPA_ACCESS_KEY_ID:-}" ] || [ -z "${RCLONE_CONFIG_SUPA_SECRET_ACCESS_KEY:-}" ]; then
            echo "::warning::مفاتيح S3 مش متضافة، الفواتير ما اتنسختش"; exit 0
          fi
          umask 077
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          trap 'rm -f ~/.config/rclone/rclone.conf' EXIT
          count=$(rclone lsf supa:invoices --recursive --files-only | wc -l)
          echo "ملفات الفواتير في Supabase: $count"
          if [ "$count" -eq 0 ]; then echo "::error::مفيش ولا ملف ظاهر، راجع المفتاح"; exit 1; fi
          # copy مش sync: عمره ما يمسح من Drive. الموجود بنفس الحجم ما بيتنزلش تاني
          rclone copy supa:invoices "$INVOICES_DIR" --size-only
          # تأكيد إن كل ملف في Supabase موجود على Drive بنفس الحجم
          rclone check supa:invoices "$INVOICES_DIR" --one-way --size-only
          echo "كل الفواتير موجودة على Drive"

      - name: Email the Excel backup
        if: steps.guard.outputs.skip != 'true'
        # بيتخطى لو أسرار الإيميل مش متضافة، والنسخة نفسها مش بتتأثر
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GMAIL_USER:-}" ] || [ -z "${GMAIL_APP_PASSWORD:-}" ]; then
            echo "::notice::أسرار الإيميل مش متضافة، تخطّيت إرسال الإيميل"; exit 0
          fi
          [ -f "legacy_backup_${STAMP}.xlsx" ] || { echo "::notice::مفيش ملف إكسيل أبعته"; exit 0; }
          python3 - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          stamp = os.environ["STAMP"]
          me = os.environ["GMAIL_USER"]
          m = EmailMessage()
          m["From"] = me
          m["To"] = me
          m["Subject"] = f"نسخة احتياطية المصباح {stamp}"
          m.set_content("النسخة الاحتياطية الأخيرة مرفقة: إكسيل وملف الاسترجاع الكامل (.dump).")
          dump = f"legacy_backup_{stamp}.dump"
          # Gmail بيرفض أكتر من 25 ميجا، فلو الـ dump كبر عن 18 ميجا بيفضل على Drive بس
          if os.path.getsize(dump) <= 18 * 1024 * 1024:
              with open(dump, "rb") as f:
                  m.add_attachment(f.read(), maintype="application", subtype="octet-stream", filename=dump)
          else:
              m.set_content("النسخة الاحتياطية الأخيرة مرفقة (إكسيل). ملف الاسترجاع (.dump) كبير على الإيميل، موجود على Google Drive.")
          with open(f"legacy_backup_{stamp}.xlsx", "rb") as f:
              m.add_attachment(f.read(), maintype="application",
                               subtype="vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                               filename=f"legacy_backup_{stamp}.xlsx")
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=ssl.create_default_context()) as s:
              s.login(me, os.environ["GMAIL_APP_PASSWORD"])
              s.send_message(m)
          print("email sent")
          PY

      - name: Fail if the Excel export, the restore test or the invoice copy failed (the .dump is already safe on Drive)
        if: >-
          steps.guard.outputs.skip != 'true' &&
          (steps.excel.outcome == 'failure' || steps.restore.outcome == 'failure' || steps.invoices.outcome == 'failure')
        run: |
          echo "::error::تصدير Excel أو اختبار الاسترجاع أو نسخ الفواتير فشل، لكن نسخة .dump اترفعت على Drive، شوف الخطوة الفاشلة"
          exit 1
