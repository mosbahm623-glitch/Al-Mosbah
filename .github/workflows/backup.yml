name: Daily backup

# نسخة احتياطية من قاعدة البيانات (من غير تشفير)، بتتعمل مرتين في اليوم، وبتترفع على Google Drive بتاع صاحب التطبيق:
#   - legacy_backup_<تاريخ>.dump  للاسترجاع
#   - legacy_backup_<تاريخ>.xlsx  نفس إكسيل صفحة النسخ الاحتياطي في التطبيق (عربي، بأسماء المشاريع والحالات)
# المستودع عام: النسخة ما بتتحفظش هنا ولا في Artifacts، بتروح على Drive بس.
# أسرار مطلوبة (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL   رابط الاتصال بقاعدة البيانات (Session pooler)
#   RCLONE_CONF       محتوى ملف إعداد rclone لـ Google Drive (remote اسمه gdrive)
#   GMAIL_USER / GMAIL_APP_PASSWORD  (اختياري) إيميل Gmail وApp Password، عشان الإكسيل يتبعت على نفس الإيميل بعد كل نسخة

on:
  schedule:
    - cron: '7 4,16 * * *' # 04:07 و16:07 UTC = حوالي 6 الصبح و6 المغرب بتوقيت مصر الشتوي (7 دقايق بعد الساعة عشان GitHub بيتأخر على أول الساعة)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # قاعدة بيانات مؤقتة بنجرّب عليها استرجاع النسخة (بتتمسح مع التشغيل)
      restore-test:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      DRIVE_DIR: gdrive:mosbah-backups
      KEEP_DAYS: '30'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check secrets
        run: |
          for v in SUPABASE_DB_URL RCLONE_CONF; do
            if [ -z "${!v}" ]; then echo "::error::السر $v مش متضاف"; exit 1; fi
          done

      - name: Install tools (postgresql-client 17, rclone)
        run: |
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 rclone

      - name: Dump database
        run: |
          set -euo pipefail
          umask 077
          stamp=$(TZ=Africa/Cairo date +%Y-%m-%d_%H-%M)  # التاريخ والساعة بتوقيت مصر
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=private --schema=auth --schema=storage --schema=supabase_migrations \
            --file="legacy_backup_$stamp.dump"
          # فحص إن الملف سليم وفيه جداول
          tables=$(/usr/lib/postgresql/17/bin/pg_restore --list "legacy_backup_$stamp.dump" | grep -c "TABLE DATA" || true)
          echo "جداول فيها بيانات: $tables"
          if [ "$tables" -lt 10 ]; then echo "::error::النسخة شكلها ناقصة"; exit 1; fi
          ls -l legacy_backup_*.dump

      - name: Test restore into a temporary database and compare row counts
        id: restore
        continue-on-error: true
        env:
          PGBIN: /usr/lib/postgresql/17/bin
          TESTDB: postgresql://postgres:restore-test-only@localhost:5432/postgres
        run: |
          set -uo pipefail
          f="legacy_backup_${STAMP}.dump"
          for r in anon authenticated service_role authenticator supabase_admin supabase_auth_admin supabase_storage_admin dashboard_user; do
            "$PGBIN/psql" "$TESTDB" -qAt -c "create role $r nologin" 2>/dev/null || true
          done
          "$PGBIN/pg_restore" --no-owner --no-privileges --dbname="$TESTDB" "$f" 2> restore_errors.txt || true
          echo "أخطاء الاسترجاع (غالبًا إضافات خاصة بـ Supabase): $(grep -c 'error:' restore_errors.txt || true)"
          grep 'error:' restore_errors.txt | sed 's/^pg_restore: //' | sort | uniq -c | sort -rn | head -8 || true
          bad=0; total=0
          tables=$("$PGBIN/psql" "$SUPABASE_DB_URL" -qAt -c "select quote_ident(schemaname)||'.'||quote_ident(tablename) from pg_tables where schemaname in ('public','private','auth','storage') order by 1")
          for t in $tables; do
            a=$("$PGBIN/psql" "$SUPABASE_DB_URL" -qAt -c "select count(*) from $t" 2>/dev/null || echo ERR)
            b=$("$PGBIN/psql" "$TESTDB" -qAt -c "select count(*) from $t" 2>/dev/null || echo MISSING)
            total=$((total+1))
            if [ "$a" = "ERR" ]; then continue; fi
            diff=$(( ${a:-0} - ${b:-0} )); [ "$diff" -lt 0 ] && diff=$(( -diff ))
            tol=$(( ${a:-0} / 100 )); [ "$tol" -lt 2 ] && tol=2
            if [ "$b" = "MISSING" ] || [ "$diff" -gt "$tol" ]; then
              echo "::warning::اختلاف في $t: الأصل=$a والاسترجاع=$b"; bad=$((bad+1))
            fi
          done
          echo "جداول اتقارنت: $total، فيها اختلاف: $bad"
          if [ "$total" -lt 10 ] || [ "$bad" -gt 0 ]; then
            echo "::error::اختبار الاسترجاع فشل"; exit 1
          fi
          echo "اختبار الاسترجاع نجح: كل الجداول رجعت بنفس العدد"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Export the Excel backup (same layout as the app's Backup page)
        id: excel
        continue-on-error: true
        env:
          TZ: Africa/Cairo
        run: |
          set -euo pipefail
          umask 077
          npm ci --ignore-scripts
          npx tsx scripts/backup-excel.ts "legacy_backup_${STAMP}.xlsx"
          ls -l "legacy_backup_${STAMP}.xlsx"

      - name: Upload to Google Drive and prune old copies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone copy "legacy_backup_${STAMP}.dump" "$DRIVE_DIR"
          rclone lsl "$DRIVE_DIR" | grep "legacy_backup_${STAMP}.dump"
          if [ -f "legacy_backup_${STAMP}.xlsx" ]; then
            rclone copy "legacy_backup_${STAMP}.xlsx" "$DRIVE_DIR"
            rclone lsl "$DRIVE_DIR" | grep "legacy_backup_${STAMP}.xlsx"
          fi
          rclone delete "$DRIVE_DIR" --min-age "${KEEP_DAYS}d"
          rm -f ~/.config/rclone/rclone.conf

      - name: Email the Excel backup
        # بيتخطى لو أسرار الإيميل مش متضافة، والنسخة نفسها مش بتتأثر
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GMAIL_USER:-}" ] || [ -z "${GMAIL_APP_PASSWORD:-}" ]; then
            echo "::notice::أسرار الإيميل مش متضافة، تخطّيت إرسال الإيميل"; exit 0
          fi
          [ -f "legacy_backup_${STAMP}.xlsx" ] || { echo "::notice::مفيش ملف إكسيل أبعته"; exit 0; }
          python3 - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          stamp = os.environ["STAMP"]
          me = os.environ["GMAIL_USER"]
          m = EmailMessage()
          m["From"] = me
          m["To"] = me
          m["Subject"] = f"نسخة احتياطية المصباح {stamp}"
          m.set_content("النسخة الاحتياطية الأخيرة مرفقة: إكسيل وملف الاسترجاع الكامل (.dump).")
          dump = f"legacy_backup_{stamp}.dump"
          # Gmail بيرفض أكتر من 25 ميجا، فلو الـ dump كبر عن 18 ميجا بيفضل على Drive بس
          if os.path.getsize(dump) <= 18 * 1024 * 1024:
              with open(dump, "rb") as f:
                  m.add_attachment(f.read(), maintype="application", subtype="octet-stream", filename=dump)
          else:
              m.set_content("النسخة الاحتياطية الأخيرة مرفقة (إكسيل). ملف الاسترجاع (.dump) كبير على الإيميل، موجود على Google Drive.")
          with open(f"legacy_backup_{stamp}.xlsx", "rb") as f:
              m.add_attachment(f.read(), maintype="application",
                               subtype="vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                               filename=f"legacy_backup_{stamp}.xlsx")
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=ssl.create_default_context()) as s:
              s.login(me, os.environ["GMAIL_APP_PASSWORD"])
              s.send_message(m)
          print("email sent")
          PY

      - name: Fail if the Excel export or the restore test failed (the .dump is already safe on Drive)
        if: steps.excel.outcome == 'failure' || steps.restore.outcome == 'failure'
        run: |
          echo "::error::تصدير Excel أو اختبار الاسترجاع فشل، لكن نسخة .dump اترفعت على Drive، شوف الخطوة الفاشلة"
          exit 1
