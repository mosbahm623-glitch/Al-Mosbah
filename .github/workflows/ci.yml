name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # قيم وهمية فقط: الاختبارات والبناء لا تتصل بقاعدة البيانات الحقيقية
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Architecture check
        run: npm run architecture:check

      - name: Dead code check
        run: npm run knip

      - name: Tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Install the test browsers
        # تحميل المتصفحات بيعلّق أحياناً على سيرفرات GitHub: مهلة قصيرة ومحاولة تانية بدل ما الفحص كله يستنى 10 دقايق
        timeout-minutes: 9
        run: |
          for i in 1 2; do
            npx playwright install --with-deps chromium firefox webkit && exit 0
            echo "install attempt $i failed"; sleep 20
          done
          exit 1

      - name: Screen tests
        run: npm run test:e2e

  deploy:
    # ينشر الموقع تلقائيًا على gh-pages بعد كل دمج في main، وبس لو كل الفحوصات نجحت
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      # القيمتين دول عامين (بيظهروا في الموقع نفسه) وثابتين هنا عشان مفيش غلط يدوي في المفتاح
      VITE_SUPABASE_URL: https://kytaxbhajnmdstyiorus.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Er_ibOL4aGGNBKCicok17Q_MhCGB7TV
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # رقم النسخة بيتحسب من عدد الـ commits

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the real key was built in
        run: |
          grep -rq "kytaxbhajnmdstyiorus" dist/assets || { echo "::error::Supabase URL missing from the build"; exit 1; }
          grep -rq "sb_publishable_Er_ibOL4aGGNBKCicok17Q_MhCGB7TV" dist/assets || { echo "::error::Supabase key missing from the build"; exit 1; }
          ! grep -rq "ci-placeholder-key\|example.supabase.co" dist/assets || { echo "::error::placeholder values found in the build"; exit 1; }

      - name: Publish to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

  smoke:
    # فحص قراءة فقط على الموقع المنشور وقاعدة البيانات الحقيقية بعد كل نشر: بيتأكد إن الموقع بيفتح،
    # والقاعدة بترد، والزائر من غير دخول ما بيشوفش ولا يغيّر حاجة
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the test browser
        timeout-minutes: 9
        run: |
          for i in 1 2; do
            npx playwright install --with-deps chromium && exit 0
            echo "install attempt $i failed"; sleep 20
          done
          exit 1

      - name: Live smoke tests
        run: npm run test:live
